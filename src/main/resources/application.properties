spring.application.name=wdtb-2026-backend-likely

# ---------------------------------------------------------------
# Database: H2
# from file: ./data/wdtb.mv.db
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/wdtb;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ---------------------------------------------------------------
# Hibernate sets up the schema from the entities on every start.
#
# create-drop: tables created fresh, so data from the previous run is gone.
# The seed data at src/main/resources/data.sql. Loads after the tables exist.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.open-in-view=false
# A DDL error stops the start. By default Hibernate only logs it and the table is silently missing.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
